# Servidor
server.port=8084

# Aplicación
spring.application.name=reserva-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hostales_reserva_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

# Consultas al servicio de hostales
spring.cloud.openfeign.client.config.hostalClient.connectTimeout=3000
spring.cloud.openfeign.client.config.hostalClient.readTimeout=5000

# Consultas al servicio de habitaciones
spring.cloud.openfeign.client.config.habitacionClient.connectTimeout=3000
spring.cloud.openfeign.client.config.habitacionClient.readTimeout=5000