server.port=8081
spring.application.name=auth-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hostales_auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=false

eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.openfeign.client.config.hostal-service.connectTimeout=3000
spring.cloud.openfeign.client.config.hostal-service.readTimeout=5000

jwt.public-key=classpath:keys/public.pem
jwt.private-key=classpath:keys/private.pem
jwt.expiration-seconds=3600
jwt.issuer=hostales-auth-service

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.jackson.time-zone=America/Lima