# ==================================================
# SERVIDOR
# ==================================================

server.port=8085
spring.application.name=pago-service


# ==================================================
# POSTGRESQL
# ==================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hostales_pago_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==================================================
# JPA / HIBERNATE
# ==================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false


# ==================================================
# EUREKA
# ==================================================

eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# ==================================================
# OPENFEIGN: RESERVA-SERVICE
# ==================================================

spring.cloud.openfeign.client.config.reserva-service.connectTimeout=3000
spring.cloud.openfeign.client.config.reserva-service.readTimeout=5000


# ==================================================
# ACTUATOR
# ==================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# ==================================================
# FECHAS
# ==================================================

spring.jackson.time-zone=America/Lima