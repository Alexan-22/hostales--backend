# Servidor
server.port=8083

# Aplicación
spring.application.name=habitacion-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hostales_habitacion_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

# Tiempo máximo de conexión y respuesta de hostal-service, en milisegundos
spring.cloud.openfeign.client.config.hostal-service.connectTimeout=3000
spring.cloud.openfeign.client.config.hostal-service.readTimeout=5000